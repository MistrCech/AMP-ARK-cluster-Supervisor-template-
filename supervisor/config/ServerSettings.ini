; ============================================================================
;  [ServerSettings] - SPOLECNE pro vsechny mapy clusteru
;
;  Tyhle klice supervisor NEZAPISUJE do GameUserSettings.ini - posila je
;  kazde mape na prikazovou radku (?Klic=hodnota). Overeno na v361.7: rucne
;  napsany GameUserSettings.ini ARK cely zahodi a vygeneruje znovu s vychozimi
;  hodnotami (stackovani x10 odtud se na server nikdy nedostalo). Hodnoty z
;  prikazove radky ARK prevezme a sam si je do sveho ini zapise.
;
;  Smi sem jen klice, ktere jdou na prikazovou radku (wiki: tabulka
;  [ServerSettings], sloupec CMD). Hodnota NESMI obsahovat mezeru ani '?' -
;  ARK prikazovou radku u prvni mezery utne a vsechno za ni tise zahodi.
;  Supervisor takovy radek vynecha a ohlasi.
;
;  Hesla, jmeno serveru, porty a MaxPlayers sem nepatri - ty sklada supervisor
;  z nastaveni instance. Nasobky rychlosti jsou v presets.json (eventy).
;  Zmena plati od pristiho startu nebo restartu mapy.
; ============================================================================
[ServerSettings]
ItemStackSizeMultiplier=10.0
AllowThirdPersonPlayer=True
ShowMapPlayerLocation=True
ServerCrosshair=True
AllowHideDamageSourceFromLogs=False
